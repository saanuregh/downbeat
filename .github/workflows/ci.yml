name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Reads the version and components from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Console screens
        working-directory: crates/downbeat-console/web
        run: |
          bun install --frozen-lockfile
          bun fmt --check
          bun run check
          bun run lint
          bun run test
          bun run build

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The runners include shellcheck. The tasks are plain bash, so CI runs them without mise.
      - name: Lint the task scripts
        run: shellcheck --external-sources mise-tasks/test-rust mise-tasks/demo mise-tasks/postgres.sh

      - name: API docs build without warnings
        run: cargo doc --no-deps -p downbeat -p downbeat-api -p downbeat-client -p downbeat-macros
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Example schedule snapshot is current
        run: cargo run -q -p market -- check --verify-snapshot examples/market/schedules.snapshot > /dev/null

      # The real sign-in test runs against Dex, which publishes no release binary; Nix builds it.
      - uses: cachix/install-nix-action@v31

      - name: Dex for the real sign-in test
        run: echo "DOWNBEAT_TEST_DEX=$(nix build --no-link --print-out-paths nixpkgs#dex-oidc)/bin/dex" >> "$GITHUB_ENV"

      - name: Test
        run: mise-tasks/test-rust
        env:
          # GitHub's Ubuntu runners include Google Chrome; the screens test renders every screen in it.
          DOWNBEAT_TEST_BROWSER: google-chrome
