[package]
name = "downbeat-guide-check"
description = "Compiles every Rust sample in the README and the user guide, so the docs cannot drift from the API."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
downbeat.workspace = true
downbeat-client.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true

[build-dependencies]
syn.workspace = true

# The samples are compiled as the docs show them, so the workspace's lints do not apply.
[lints]
