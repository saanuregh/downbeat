[workspace]
resolver = "3"
members = ["crates/downbeat", "crates/downbeat-macros", "crates/downbeat-api", "crates/downbeat-client", "tests/e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/downbeat-rs/downbeat"
homepage = "https://github.com/downbeat-rs/downbeat"
authors = ["The downbeat authors"]

[workspace.dependencies]
downbeat = { path = "crates/downbeat", version = "0.1.0" }
downbeat-macros = { path = "crates/downbeat-macros", version = "0.1.0" }
downbeat-api = { path = "crates/downbeat-api", version = "0.1.0" }
downbeat-client = { path = "crates/downbeat-client", version = "0.1.0" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["pem", "rand_core"] }
libc = "0.2"
proc-macro2 = "1"
quote = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
syn = { version = "2", features = ["full", "extra-traits"] }
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "compression-full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
